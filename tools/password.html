<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>비밀번호 해시 만들기</title>
<style>body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:#F6F7F9;display:flex;justify-content:center;padding:60px 16px;color:#111827}
.c{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:28px;width:520px}h1{font-size:18px;margin:0 0 6px}p{color:#6B7280;font-size:13px;line-height:1.6}
input{width:100%;height:42px;border:1px solid #E5E7EB;border-radius:8px;padding:0 12px;font-size:15px;box-sizing:border-box}
code{display:block;word-break:break-all;background:#F3F4F6;border-radius:8px;padding:12px;margin-top:12px;font-size:13px;min-height:20px}
button{margin-top:10px;height:36px;padding:0 14px;border:1px solid #111827;background:#111827;color:#fff;border-radius:8px;cursor:pointer}</style></head>
<body><div class="c"><h1>새 비밀번호 해시 만들기</h1>
<p>새 비밀번호를 입력하면 아래에 해시값이 만들어집니다. 이 값을 <b>js/config.js</b>의 <b>passwordHash</b>에 붙여넣고 GitHub에 저장(commit)하면 비밀번호가 바뀝니다. 비밀번호 원문은 어디에도 저장되지 않습니다.</p>
<input id="p" type="text" placeholder="새 비밀번호"><code id="o"></code><button id="b">해시 복사</button></div>
<script>
const p=document.getElementById('p'),o=document.getElementById('o');
p.oninput=async()=>{if(!p.value){o.textContent='';return;}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p.value));o.textContent=Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');};
document.getElementById('b').onclick=()=>{navigator.clipboard.writeText(o.textContent);document.getElementById('b').textContent='복사됨';};
</script></body></html>
